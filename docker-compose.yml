version: '3.8'

services:
  citegraph:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - MODEL_PATH=/app/models/model_5000.pth
      - DATA_PATH=/app/data/processed

networks:
  app-network:
    driver: bridge
