name: CML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # optionally use a convenient Ubuntu LTS + DVC + CML image
    # container: ghcr.io/iterative/cml:0-dvc2-base1
    steps:
      - uses: actions/checkout@v3
      - uses: iterative/setup-cml@v1

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          HYDRA_FULL_ERROR: 1
        run: |
          # Your ML workflow goes here
          cd ${{ github.workspace }}

          # Install dependencies
          pip install -r requirements.txt

          # Create comprehensive report
          echo "# Model Training and Evaluation Report" > report.md

          # Training section
          echo "## Training Metrics" >> report.md
          echo "### Training Progress (at 50-epoch intervals)" >> report.md
          # echo "\`\`\`" >> report.md
          echo "Test"
          # echo "Test2"
          python src/models/model1/train.py epochs=50 # 2>&1 | tee -a report.md
          # echo "\`\`\`" >> report.md

      - name: Evaluate model
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}

          # Evaluation section
          echo "## Model Evaluation" >> report.md
          echo "### Test Results" >> report.md
          # echo "\`\`\`" >> report.md
          # Run test script from the src directory to handle relative imports
          cd src/models/model1
          python test.py # 2>&1 | tee -a ../../../../report.md
          # cd ../../../..
          # echo "\`\`\`" >> report.md

          # # Add any evaluation metrics or visualizations
          if [ -f "evaluation_report.txt" ]; then
            echo "### Detailed Evaluation Metrics" >> report.md
            # echo "\`\`\`" >> report.md
            cat evaluation_report.txt >> report.md
            # echo "\`\`\`" >> report.md
          fi

      - name: Generate visualizations
        run: |
          cd ${{ github.workspace }}

          # Add visualizations section if they exist
          echo "## Model Visualizations" >> report.md

          if [ -f "confusion_matrix.png" ]; then
            echo "### Confusion Matrix" >> report.md
            echo "![](./confusion_matrix.png)" >> report.md
            # cml-publish confusion_matrix.png --md >> report.md
          fi

          if [ -f "learning_curves.png" ]; then
            echo "### Learning Curves" >> report.md
            echo "![](./learning_curves.png)" >> report.md
            # cml-publish learning_curves.png --md >> report.md
          fi

          if [ -f "model_architecture.png" ]; then
            echo "### Model Architecture" >> report.md
            echo "![](./model_architecture.png)" >> report.md
            # cml-publish model_architecture.png --md >> report.md
          fi

      - name: Post report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add timestamp and commit info
          echo "## Report Information" >> report.md
          echo "Generated on: $(date)" >> report.md
          echo "Commit: ${{ github.sha }}" >> report.md

          # Post the complete report
          cml comment create report.md
