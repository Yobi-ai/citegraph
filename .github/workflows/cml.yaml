name: CML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # optionally use a convenient Ubuntu LTS + DVC + CML image
    # container: ghcr.io/iterative/cml:0-dvc2-base1
    steps:
      - uses: actions/checkout@v3
      - uses: iterative/setup-cml@v1

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          HYDRA_FULL_ERROR: 1
        run: |
          # Your ML workflow goes here
          cd ${{ github.workspace }}

          # Install dependencies
          pip install -r requirements.txt

          # Run training with test configuration
          python src/models/model1/train.py epochs=500

          # Create results file
          echo "## Training Report" > results.txt
          echo "### Model Performance" >> results.txt
          echo "Training completed successfully!" >> results.txt

          # Get latest MLflow metrics
          echo "### Latest MLflow Metrics" >> results.txt
          echo "\`\`\`" >> results.txt
          mlflow ui --port 5000 &
          sleep 5
          curl http://localhost:5000/api/2.0/mlflow/runs/search | jq '.' >> results.txt
          echo "\`\`\`" >> results.txt

          # Get training results from the last run
          echo "### Training Results" >> results.txt
          echo "\`\`\`" >> results.txt
          if [ -f "mlruns/latest_run/metrics.json" ]; then
            cat mlruns/latest_run/metrics.json >> results.txt
          else
            echo "No metrics file found" >> results.txt
          fi
          echo "\`\`\`" >> results.txt

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post reports as comments in GitHub PRs
          cat results.txt >> report.md
          cml comment create report.md
