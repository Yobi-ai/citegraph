name: CML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # optionally use a convenient Ubuntu LTS + DVC + CML image
    # container: ghcr.io/iterative/cml:0-dvc2-base1
    steps:
      - uses: actions/checkout@v3
      - uses: iterative/setup-cml@v1

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          HYDRA_FULL_ERROR: 1
        run: |
          # Your ML workflow goes here
          cd ${{ github.workspace }}

          # Install dependencies
          pip install -r requirements.txt

          # Run training and capture specific metrics
          echo "## Training Report" > results.txt
          echo "### Training Metrics (at 50-epoch intervals)" >> results.txt
          echo "\`\`\`" >> results.txt
          python src/models/model1/train.py epochs=500 2>&1 | tee -a results.txt
          echo "\`\`\`" >> results.txt

      - name: Evaluate model
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          cd ${{ github.workspace }}
          python -m src.models.model1.test
      - name: Write report
        env:
          # this authenticates that the right permissions are in place
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # send all information to report.md that will be reported to us when the workflow finish
          cat evaluation_report.txt >> report.md
          cml-publish confusion_matrix.png --md >> report.md
          cml-send-comment report.md

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post reports as comments in GitHub PRs
          cat results.txt >> report.md
          cml comment create report.md
