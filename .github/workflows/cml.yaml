name: CML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gdrive]"
          pip install git+https://github.com/iterative/cml.git

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run training
          python src/models/model1/train.py experiment=test_train

          # Create CML report
          echo "## Training Report" > report.md
          echo "### Model Performance" >> report.md
          echo "Training completed successfully!" >> report.md

          # Get latest metrics from MLflow
          echo "### Latest Metrics" >> report.md
          echo "\`\`\`" >> report.md
          mlflow ui --port 5000 &
          sleep 5
          curl http://localhost:5000/api/2.0/mlflow/runs/search | jq '.' >> report.md
          echo "\`\`\`" >> report.md

          # Send report
          cml comment create report.md
