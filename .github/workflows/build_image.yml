name: Build & Push Docker Image with Versioning to GCP

on:
  push:
    tags:
      - 'v*'  # Triggers only on version tags like v1.0.0
    branches:
      - main  # Also runs on main (optional)

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: your-project-id
      REGION: us  # or your region
      REPOSITORY: my-repo
      IMAGE_NAME: my-app

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        project_id: infra-actor-462322-s1

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker us-east1-docker.pkg.dev

    - name: Set version tags
      id: vars
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="dev-${GITHUB_SHA::7}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and Push Docker Image
      run: |
        IMAGE_URI=us-east1-docker.pkg.dev/infra-actor-462322-s1/citegraph/graph_image

        docker build -t $IMAGE_URI:latest -t $IMAGE_URI:${{ env.VERSION }} .
        docker push $IMAGE_URI:latest

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: citegraph
        image: us-east1-docker.pkg.dev/infra-actor-462322-s1/citegraph/graph_image:latest
        region: us-east1
        project_id: infra-actor-462322-s1
        flags: >
          --memory=2000Mi
          --cpu=2
