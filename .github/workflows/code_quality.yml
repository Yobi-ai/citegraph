name: Code Quality

on:
  push:
    branches: [ testcases-alen ]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff isort mypy pytest pytest-cov pytest-asyncio types-PyYAML types-requests types-setuptools types-urllib3
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run isort
      run: isort . --check-only --profile black

    - name: Run mypy
      run: mypy . --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs --follow-imports=silent --allow-untyped-defs --allow-subclassing-any --allow-untyped-calls

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest src/ --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
