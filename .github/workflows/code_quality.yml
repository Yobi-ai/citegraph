name: Code Quality

on:
  push:
    branches: [ testcases-alen ]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff isort mypy pytest pytest-cov pytest-asyncio types-PyYAML types-requests types-setuptools types-urllib3
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run isort
      run: isort . --check-only --profile black

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest src/ --cov=src --cov-report=term-missing --cov-report=term
